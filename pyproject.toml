[project]
name = "acme"
version = "0.0.1"
description = "Acme — a small, model-neutral autonomous-company control plane"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
    "webauthn>=3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Postgres-backed durable runtime. psycopg powers the durable event ledger
# (acme/kernel/ledger_pg.py); dbos is for the workflow primitives layered on top.
durable = ["psycopg[binary]>=3", "dbos>=2"]

[project.scripts]
acme = "acme.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["acme*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
