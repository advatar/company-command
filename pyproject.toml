[project]
name = "comcmd"
version = "0.1.0"
description = "Company Command — a governed control plane for AI-run companies"
authors = [{name = "Advatar"}]
keywords = ["agents", "autonomous-company", "workflow", "governance", "approvals"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
    "webauthn>=3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
# HTTP API backend (`comcmd serve`).
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
# Postgres-backed durable runtime. psycopg powers the durable event ledger
# (comcmd/kernel/ledger_pg.py); dbos is for the workflow primitives layered on top.
durable = ["psycopg[binary]>=3", "dbos>=2"]
# Optional OpenTelemetry export of gateway decisions / spans (COMCMD_OTEL=1).
otel = ["opentelemetry-api>=1.20"]

[project.scripts]
comcmd = "comcmd.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["comcmd*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
