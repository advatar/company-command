[project]
name = "acme"
version = "0.0.1"
description = "Acme — a small, model-neutral autonomous-company control plane"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
acme = "acme.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["acme*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
