# Company Command backend + Postgres. `docker compose up` gives a durable engine at :8080.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: comcmd
      POSTGRES_DB: comcmd
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - comcmd-pgdata:/var/lib/postgresql/data

  comcmd:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Presence of this DSN flips Company Command into durable mode (Postgres + DBOS).
      COMCMD_DATABASE_URL: postgresql://postgres:comcmd@postgres:5432/comcmd
      COMCMD_RP_ID: localhost
      COMCMD_RP_ORIGIN: https://localhost
      COMCMD_COMPANIES_DIR: /app/companies
    ports:
      - "8080:8080"

volumes:
  comcmd-pgdata:
