name: ci

on:
  push:
    branches: [main, "acme-**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: acme
          POSTGRES_DB: acme
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,durable]"

      - name: Test (in-process, no infra)
        run: pytest -q

      - name: Test (durable — Postgres + DBOS)
        env:
          ACME_TEST_DATABASE_URL: postgresql://postgres:acme@127.0.0.1:5433/acme
          ACME_TEST_DBOS_URL: postgresql://postgres:acme@127.0.0.1:5433/acme
        run: pytest -q
